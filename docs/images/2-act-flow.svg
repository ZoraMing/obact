<svg xmlns="http://www.w3.org/2000/svg" width="760" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" style="background:#fff" viewBox="0 0 760 656" role="img" aria-label="缓存命中就走 S1，不调用模型；未命中或失败才走 S2" font-size="13"><defs><marker id="act-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8780"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1e1d">缓存命中就走 S1，不调用模型；未命中或失败才走 S2</text><text x="24" y="50" font-size="11.5" fill="#5f5e5a">左列 S1 不调用模型，右列 S2 调用模型；红框是失败出口</text><g fill="none" stroke="#8a8780" stroke-width="1.25"><path d="M380 124V140" marker-end="url(#act-arrow)"></path><path d="M308 172H176V246" marker-end="url(#act-arrow)"></path><path d="M452 172H584V246" marker-end="url(#act-arrow)"></path><path d="M296 276H462" marker-end="url(#act-arrow)"></path><path d="M584 304V326" marker-end="url(#act-arrow)"></path><path d="M584 400V422" marker-end="url(#act-arrow)"></path><path d="M584 480V502" marker-end="url(#act-arrow)"></path><path d="M584 560V612H462" marker-end="url(#act-arrow)"></path><path d="M176 336V612H298" marker-end="url(#act-arrow)"></path><path d="M464 388H400V414" marker-end="url(#act-arrow)"></path><path d="M464 452H438" marker-end="url(#act-arrow)"></path><path d="M296 320H352V414" marker-end="url(#act-arrow)"></path></g><text x="242" y="164" text-anchor="middle" font-size="11.5" fill="#5f5e5a">命中</text><text x="518" y="164" text-anchor="middle" font-size="11.5" fill="#5f5e5a">未命中</text><text x="380" y="268" text-anchor="middle" font-size="11.5" fill="#5f5e5a">核对不符或执行出错 → 转 S2</text><text x="184" y="470" font-size="11.5" fill="#5f5e5a">全部通过</text><g><rect x="260" y="68" width="240" height="56" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="380" y="92" text-anchor="middle" font-weight="600" fill="#1f1e1d">act(指令, params)</text><text x="380" y="108" text-anchor="middle" font-size="11.5" fill="#5f5e5a">生成缓存键</text></g><g><polygon points="308,172 380,142 452,172 380,202" fill="none" stroke="#8a8780" stroke-width="1.25"></polygon><text x="380" y="176" text-anchor="middle" fill="#1f1e1d">缓存命中？</text></g><g><rect x="56" y="248" width="240" height="88" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"></rect><text x="176" y="272" text-anchor="middle" font-weight="600" fill="#1f1e1d">S1 回放（不调用模型）</text><text x="176" y="288" text-anchor="middle" font-size="11.5" fill="#5f5e5a">核对：只匹配 1 个元素且名称一致</text><text x="176" y="304" text-anchor="middle" font-size="11.5" fill="#5f5e5a">执行：参数填回选择器</text><text x="176" y="320" text-anchor="middle" font-size="11.5" fill="#5f5e5a">有 expect 就核对结果</text></g><g><rect x="464" y="248" width="240" height="56" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="584" y="272" text-anchor="middle" font-weight="600" fill="#1f1e1d">快照</text><text x="584" y="288" text-anchor="middle" font-size="11.5" fill="#5f5e5a">元素清单 + 编号截图</text></g><g><rect x="464" y="328" width="240" height="72" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="584" y="352" text-anchor="middle" font-weight="600" fill="#1f1e1d">模型：先 fast，失败换 smart</text><text x="584" y="368" text-anchor="middle" font-size="11.5" fill="#5f5e5a">输入：指令 + 元素清单 + 截图</text><text x="584" y="384" text-anchor="middle" font-size="11.5" fill="#5f5e5a">输出：元素编号，canvas 给坐标</text></g><g><rect x="464" y="424" width="240" height="56" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="584" y="448" text-anchor="middle" font-weight="600" fill="#1f1e1d">执行并核对 expect</text><text x="584" y="464" text-anchor="middle" font-size="11.5" fill="#5f5e5a">按编号查选择器，或按坐标点击</text></g><g><rect x="464" y="504" width="240" height="56" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="584" y="528" text-anchor="middle" font-weight="600" fill="#1f1e1d">写缓存（自愈时覆盖）</text><text x="584" y="544" text-anchor="middle" font-size="11.5" fill="#5f5e5a">参数值替换成占位符</text></g><g><rect x="324" y="416" width="112" height="72" rx="8" fill="none" stroke="#d23b3b" stroke-width="2"></rect><text x="380" y="440" text-anchor="middle" font-weight="600" fill="#1f1e1d">StepFailed</text><text x="380" y="456" text-anchor="middle" font-size="11.5" fill="#5f5e5a">smart 也失败，或</text><text x="380" y="472" text-anchor="middle" font-size="11.5" fill="#5f5e5a">expect 不通过</text></g><g><rect x="300" y="592" width="160" height="40" rx="8" fill="none" stroke="#8a8780" stroke-width="1.25"></rect><text x="380" y="616" text-anchor="middle" font-weight="600" fill="#1f1e1d">返回结果</text></g></svg>
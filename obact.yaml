viewport: {width: 1280, height: 800}   # 固定视口，保证 canvas 坐标可以复用
cache_dir: .obact
headless: false
models:                                # 两个槽位都必须支持图像输入；密钥从 api_key_env 指定的环境变量读取
  fast:  {base_url: "https://token-plan-cn.xiaomimimo.com/v1", model: mimo-v2.6-flash, api_key_env: OBACT_KEY}
  smart: {base_url: "https://token-plan-cn.xiaomimimo.com/v1", model: mimo-v2.6-flash, api_key_env: OBACT_KEY}

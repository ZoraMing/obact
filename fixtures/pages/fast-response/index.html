<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>快速响应</title>
<style>
  body { margin: 0; padding: 16px 24px; font: 14px/1.6 sans-serif; color: #222; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  #result { min-height: 1.6em; font-weight: bold; }
  #history { color: #667; }
</style>
</head>
<body>
  <h1>快速响应</h1>
  <p>点击后请求接口，接口约 <span id="delay"></span> 毫秒返回，页面随即显示结果。</p>
  <button type="button" id="query">查询订单</button>
  <p id="result" role="status"></p>
  <ol id="history"></ol>

  <script>
    const params = new URLSearchParams(location.search);
    const seed = Number(params.get('seed')) || 1;
    const delay = params.has('delay') ? Number(params.get('delay')) : 20;
    document.getElementById('delay').textContent = String(delay);
    const fmt = (n) => {
      const [int, frac] = n.toFixed(2).split('.');
      return `${int.replace(/\B(?=(\d{3})+(?!\d))/g, ',')}.${frac}`;
    };
    let n = 0;
    document.getElementById('query').addEventListener('click', async () => {
      const k = ++n;
      const out = document.getElementById('result');
      out.textContent = `第 ${k} 次查询中…`;
      const r = await fetch(`/api/fast-response/data?n=${k}&seed=${seed}&delay=${delay}`);
      const d = await r.json();
      const text = `第 ${d.n} 次查询：订单 ${d.order_id}，金额 ${fmt(d.amount)} 元`;
      out.textContent = text;
      const li = document.createElement('li');
      li.textContent = text;
      document.getElementById('history').append(li);
    });
  </script>
</body>
</html>

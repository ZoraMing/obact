<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>订单编辑 · 改文案</title>
<link rel="stylesheet" href="style.css">
<!-- 改版夹具 v2：改文案。按钮、链接、标签、占位符文字都换了说法；id、类名、层级、位置不变。 -->
</head>
<body>
<header class="topbar">
  <input type="search" id="order-search" placeholder="输入订单号查找" data-x-key="search">
  <button id="search-btn" class="btn" data-x-key="search-btn">查找</button>
  <span class="spacer"></span>
  <a href="#help" data-x-key="help">使用帮助</a>
  <button type="button" class="icon-btn icon-close" data-x-key="close"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke="#333"/></svg></button>
</header>
<div class="notice" data-testid="shipping-notice">物流通知：部分地区运费上调。<button type="button" class="icon-btn notice-close" data-x-key="notice-close"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke="#333"/></svg></button></div>
<div class="toolbar">
  <button type="button" id="tb-1" class="btn" data-x-key="create">新建订单</button>
  <button type="button" id="tb-2" class="btn" data-x-key="import">批量导入</button>
  <button type="button" id="tb-3" class="btn" data-x-key="export">导出表格</button>
</div>
<form id="order-form">
  <h2>订单 SO-24003</h2>
  <div class="field"><label for="customer">客户</label><input id="customer" name="customer" data-x-key="customer"></div>
  <div class="field"><label for="phone">手机号</label><input id="phone" name="phone" data-x-key="phone"></div>
  <div class="field"><label for="status">订单状态</label>
    <select id="status" name="status" data-x-key="status"><option>待审核</option><option>已发货</option><option>已取消</option></select>
  </div>
  <div class="field"><label for="remark">备注说明</label><textarea id="remark" name="remark" data-x-key="remark"></textarea></div>
  <div class="field"><input type="checkbox" id="urgent" name="urgent" data-x-key="urgent"><label for="urgent">加急</label></div>
  <table class="items">
    <tr data-key="sku-apple"><td>苹果</td><td>2 箱</td><td><button type="button" class="link-btn" data-x-key="remove-apple">删除商品</button></td></tr>
    <tr data-key="sku-pear"><td>梨</td><td>1 箱</td><td><button type="button" class="link-btn" data-x-key="remove-pear">删除商品</button></td></tr>
  </table>
  <div class="actions">
    <button id="save-btn" class="btn primary" data-x-key="save">保存修改</button>
    <button type="button" id="cancel-btn" class="btn" data-x-key="cancel">返回</button>
    <button type="button" id="delete-btn" class="btn danger" data-x-key="delete">作废订单</button>
  </div>
</form>
<script src="log.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Canvas 图表</title>
<style>
  body { margin: 0; padding: 12px 20px; font: 14px/1.5 sans-serif; color: #222; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0; }
  .tools { display: flex; gap: 8px; }
  #chart { display: block; width: 100%; height: 68vh; outline: 1px solid #dde; }
  body.small #chart { width: 320px; height: 180px; }
  h2 { font-size: 16px; margin: 12px 0 4px; }
</style>
</head>
<body>
  <header>
    <h1>月度销售额（万元）</h1>
    <div class="tools">
      <button type="button" id="refresh">刷新</button>
      <button type="button" id="export">导出图片</button>
      <button type="button" id="clear">清空日志</button>
    </div>
  </header>
  <canvas id="chart" role="img" aria-label="月度销售额柱状图"></canvas>
  <h2>操作日志</h2>
  <ol id="log"></ol>

  <script>
    // 布局（CSS 像素，与测试中的换算一致）：四周留白，12 根柱子等宽分布在绘图区，柱宽占槽宽的 60%
    const PAD = { l: 64, r: 24, t: 40, b: 48 };
    const N = 12;
    const BAR = 0.6;
    const params = new URLSearchParams(location.search);
    const seed = Number(params.get('seed')) || 1;
    if (params.get('size') === 'small') document.body.classList.add('small');

    // 确定性数据：mulberry32(seed)，每根柱 20 ~ 100 万元
    let a = (seed * 0x9e3779b1) >>> 0;
    const rand = () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const values = Array.from({ length: N }, () => Math.round(20 + rand() * 80));
    const MAX = 100;
    window.chartValues = values;
    const logs = (window.chartLog = []);

    const canvas = document.getElementById('chart');
    const g = canvas.getContext('2d');
    let selected = -1;

    function geometry() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const slot = (w - PAD.l - PAD.r) / N;
      const plotH = h - PAD.t - PAD.b;
      const base = h - PAD.b;
      return values.map((v, i) => {
        const bw = slot * BAR;
        const x = PAD.l + i * slot + (slot - bw) / 2;
        const bh = (v / MAX) * plotH;
        return { x, y: base - bh, w: bw, h: bh, base };
      });
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(canvas.clientWidth * dpr);
      canvas.height = Math.round(canvas.clientHeight * dpr);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      g.clearRect(0, 0, w, h);
      g.fillStyle = '#fff';
      g.fillRect(0, 0, w, h);
      g.strokeStyle = '#99a';
      g.beginPath();
      g.moveTo(PAD.l, PAD.t);
      g.lineTo(PAD.l, h - PAD.b);
      g.lineTo(w - PAD.r, h - PAD.b);
      g.stroke();
      g.font = '12px sans-serif';
      g.textAlign = 'center';
      geometry().forEach((b, i) => {
        g.fillStyle = i === selected ? '#e67e22' : '#4a90d9';
        g.fillRect(b.x, b.y, b.w, b.h);
        g.fillStyle = '#333';
        g.fillText(`${i + 1}月`, b.x + b.w / 2, b.base + 18);
        g.fillText(String(values[i]), b.x + b.w / 2, b.y - 6);
      });
    }

    function log(text) {
      logs.push(text);
      const li = document.createElement('li');
      li.textContent = text;
      document.getElementById('log').append(li);
    }

    canvas.addEventListener('click', (e) => {
      const r = canvas.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      const i = geometry().findIndex((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.base);
      if (i < 0) {
        log(`未点中柱子（${Math.round(x)}, ${Math.round(y)}）`);
        return;
      }
      selected = i;
      draw();
      log(`点中柱子 ${i + 1}（${i + 1}月，${values[i]} 万元）`);
    });
    document.getElementById('refresh').addEventListener('click', () => {
      selected = -1;
      draw();
      log('按钮：刷新');
    });
    document.getElementById('export').addEventListener('click', () => log('按钮：导出图片'));
    document.getElementById('clear').addEventListener('click', () => {
      logs.length = 0;
      document.getElementById('log').replaceChildren();
    });
    addEventListener('resize', draw);
    draw();
  </script>
</body>
</html>

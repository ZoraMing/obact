<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>订单管理（动态属性）</title>
<!--
  夹具：动态属性（PRD 9.3，FR-06、FR-07）。
  每次加载 id 与类名都变：有 ?seed= 时由 seed 决定（同一 seed 结果相同），否则每次不同。
  - id 模仿常见框架：React useId（:r1k:）、Ember（ember4821）、随机串（btn-k7x2m9）；
  - 类名模仿 CSS-in-JS / CSS Modules：css-1x9k3a、sc-bQdVaJ、OrderTable_btn__a8Xk2，样式也按生成的类名注入；
  - 订单表每行有同名的“编辑”“删除”按钮，行上的 data-row-key 是订单号（业务主键），行顺序也随 seed 打乱。
  点击记录：window.__log（[{op, order}]）与页面上的“操作记录”列表。
-->
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const raw = params.get('seed');
  // 没有 seed 时每次随机取一个（页面上会显示，便于复现）
  const seedText = raw ?? String(crypto.getRandomValues(new Uint32Array(1))[0]);
  let h = 2166136261;
  for (const ch of seedText) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  let a = h >>> 0;
  // mulberry32
  const rng = () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const B36 = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const LETTERS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const pick = (s) => s[Math.floor(rng() * s.length)];
  const str = (n, alphabet = B36) => Array.from({ length: n }, () => pick(alphabet)).join('');
  // 随机串保证“字母+数字”混合（真实哈希值的样子）
  const hash = () => pick(LETTERS.slice(0, 26)) + Math.floor(rng() * 10) + str(4);
  const used = new Set();
  const uniq = (make) => {
    for (;;) {
      const v = make();
      if (!used.has(v)) {
        used.add(v);
        return v;
      }
    }
  };
  const id = (prefix) =>
    uniq(() => {
      const k = Math.floor(rng() * 3);
      if (k === 0) return `:r${str(3)}:`;
      if (k === 1) return `ember${1000 + Math.floor(rng() * 9000)}`;
      return `${prefix}-${hash()}`;
    });
  const cls = (component, part) =>
    uniq(() => {
      const k = Math.floor(rng() * 3);
      if (k === 0) return `css-${hash()}`;
      if (k === 1) return `sc-${str(6, LETTERS)}`;
      return `${component}_${part}__${hash()}`;
    });

  const orders = [
    { no: 'SO-24001', customer: '华东仓储', amount: '¥12,800.00', status: '待审核' },
    { no: 'SO-24002', customer: '星河贸易', amount: '¥3,560.50', status: '已发货' },
    { no: 'SO-24003', customer: '北辰科技', amount: '¥980.00', status: '待审核' },
    { no: 'SO-24004', customer: '南山食品', amount: '¥45,200.00', status: '已取消' },
    { no: 'SO-24005', customer: '东方物流', amount: '¥7,330.00', status: '待发货' },
    { no: 'SO-24006', customer: '西岭文化', amount: '¥15,000.00', status: '待审核' },
  ];
  for (let i = orders.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [orders[i], orders[j]] = [orders[j], orders[i]];
  }

  const c = {
    page: cls('Page', 'root'),
    title: cls('Page', 'title'),
    bar: cls('Toolbar', 'root'),
    input: cls('Toolbar', 'input'),
    primary: cls('Button', 'primary'),
    icon: cls('Button', 'icon'),
    table: cls('OrderTable', 'root'),
    row: cls('OrderTable', 'row'),
    cell: cls('OrderTable', 'cell'),
    btn: cls('OrderTable', 'btn'),
    danger: cls('OrderTable', 'danger'),
    link: cls('OrderTable', 'link'),
    log: cls('Log', 'list'),
  };
  const style = document.createElement('style');
  style.textContent = `
    .${c.page} { font: 14px/1.6 system-ui, sans-serif; margin: 24px; }
    .${c.title} { font-size: 20px; margin: 0 0 12px; }
    .${c.bar} { display: flex; gap: 8px; margin-bottom: 12px; }
    .${c.input} { padding: 4px 8px; width: 220px; }
    .${c.primary} { background: #1677ff; color: #fff; border: 0; padding: 4px 12px; border-radius: 4px; }
    .${c.icon} { width: 30px; height: 30px; padding: 0; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
    .${c.table} { border-collapse: collapse; min-width: 640px; }
    .${c.row}:nth-child(even) { background: #fafafa; }
    .${c.cell} { border-bottom: 1px solid #eee; padding: 6px 10px; text-align: left; }
    .${c.btn} { border: 1px solid #d9d9d9; background: #fff; padding: 2px 10px; margin-right: 6px; border-radius: 4px; }
    .${c.danger} { color: #ff4d4f; border-color: #ffccc7; }
    .${c.link} { color: #1677ff; }
    .${c.log} { color: #555; }
  `;
  document.head.append(style);

  const log = [];
  window.__log = log;
  window.__seed = seedText;
  const record = (op, order) => {
    log.push({ op, order });
    const li = document.createElement('li');
    li.textContent = order ? `已${op} ${order}` : `已${op}`;
    document.getElementById(logId).append(li);
  };

  const logId = id('log');
  const searchId = id('search');
  const rows = orders
    .map(
      (o) => `
      <tr data-row-key="${o.no}" id="${id('row')}" class="${c.row}">
        <td class="${c.cell}" id="${id('cell')}">${o.no}</td>
        <td class="${c.cell}">${o.customer}</td>
        <td class="${c.cell}">${o.amount}</td>
        <td class="${c.cell}"><span class="${cls('Tag', 'status')}">${o.status}</span></td>
        <td class="${c.cell}">
          <button type="button" id="${id('btn')}" class="${c.btn} ${cls('OrderTable', 'edit')}" data-op="编辑">编辑</button>
          <button type="button" id="${id('btn')}" class="${c.btn} ${c.danger}" data-op="删除">删除</button>
          <a href="#/orders/${o.no}" id="${id('link')}" class="${c.link}" data-op="查看">详情</a>
        </td>
      </tr>`,
    )
    .join('');

  document.getElementById('root').innerHTML = `
    <main class="${c.page}" id="${id('main')}">
      <h1 class="${c.title}" id="${id('title')}">订单管理</h1>
      <p>本次加载的 seed：<code>${seedText}</code></p>
      <div class="${c.bar}" id="${id('bar')}">
        <input id="${searchId}" class="${c.input}" placeholder="按订单号或客户搜索">
        <button type="button" id="${id('btn')}" class="${c.primary}" data-op="查询">查询</button>
        <button type="button" id="${id('btn')}" class="${c.icon}" aria-label="刷新" data-op="刷新">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2a6 6 0 1 0 6 6h-2a4 4 0 1 1-4-4V2z"/></svg>
        </button>
        <button type="button" id="${id('btn')}" class="${c.primary} ${cls('Toolbar', 'create')}" data-op="新建">新建订单</button>
      </div>
      <table class="${c.table}" id="${id('table')}">
        <thead><tr><th class="${c.cell}">订单号</th><th class="${c.cell}">客户</th><th class="${c.cell}">金额</th><th class="${c.cell}">状态</th><th class="${c.cell}">操作</th></tr></thead>
        <tbody id="${id('tbody')}">${rows}</tbody>
      </table>
      <section aria-label="操作记录">
        <h2 class="${c.title}">操作记录</h2>
        <ol class="${c.log}" id="${logId}"></ol>
      </section>
    </main>`;

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-op]');
    if (!el) return;
    if (el.tagName === 'A') e.preventDefault();
    const row = el.closest('tr[data-row-key]');
    const op = el.dataset.op;
    if (op === '查询') {
      record(`查询“${document.getElementById(searchId).value}”`, null);
    } else record(op, row ? row.dataset.rowKey : null);
  });
})();
</script>
</body>
</html>

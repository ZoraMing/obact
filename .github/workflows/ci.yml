name: CI

# Actions 固定到具体版本号（不用 v5 这类会移动的主版本标签）；升级时改版本号并看一遍发布说明。

on:
  push:
    branches: [master]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    env:
      # 找不到浏览器时浏览器测试直接失败而不是跳过（否则装浏览器出问题时大部分测试悄悄没跑，退出码仍是 0）
      OBACT_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安装 Chrome for Testing
        run: |
          # Ubuntu 24.04 限制非特权用户命名空间，Chrome 沙箱需要放开
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          npm run browser:install
      # lint、类型检查、生成类型一致性、契约测试（T）与浏览器测试（F）
      - run: npm run check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
      - run: pip install -e "python[dev]"
      - run: ruff check python && ruff format --check python
      - run: pytest python
